name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit
  # Two overlapping runs would both push a fixed requirements file and race.
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Run audit
        id: audit
        shell: bash
        run: bash scripts/security-audit.sh

      - name: Commit fixed requirements
        if: ${{ steps.audit.outputs.changed == 'true' }}
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          add: 'requirements_dev.txt requirements_lint.txt'
          default_author: github_actions
          message: 'fix(deps): resolve audit advisories'
          push: true

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          filename: .github/security-advisory-issue.md
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          labels: security-advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: '`pip-audit` no longer reports advisories.'
