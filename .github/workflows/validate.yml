name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python: &python
              - '.github/workflows/validate.yml'
              - 'custom_components/**'
              - 'tests/**'
              - 'scripts/*.py'
              - 'pyproject.toml'
              - 'requirements_dev.txt'
              - 'requirements_lint.txt'
            integration:
              - *python
              - 'hacs.json'
            deps:
              - '.github/workflows/validate.yml'
              - 'pyproject.toml'
              - 'requirements_dev.txt'
              - 'requirements_lint.txt'
              - 'scripts/pip-audit-report.sh'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'

      - name: Set up Python
        if: ${{ steps.filter.outputs.deps == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        id: install
        if: ${{ steps.filter.outputs.deps == 'true' }}
        run: pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Run hassfest
        if: ${{ !cancelled() && steps.filter.outputs.integration == 'true' }}
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

      - name: Run HACS validation
        if: ${{ !cancelled() && steps.filter.outputs.integration == 'true' }}
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

      - name: Lint
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check

      - name: Format check Python
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.deps == 'true' }}
        shell: bash
        run: bash scripts/pip-audit-report.sh --requirement requirements_dev.txt --requirement requirements_lint.txt >>"$GITHUB_STEP_SUMMARY" || echo "::warning title=pip-audit::Advisories found or audit failed, see the job summary. Not blocking this pull request."

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version: 1.7.12
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes prettier@3.9.10 --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  tests:
    name: Tests
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_*.txt

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      - name: Type check
        run: mypy custom_components/toya_decoder

      - name: Run tests
        run: pytest --cov=custom_components/toya_decoder --cov-report=term-missing
