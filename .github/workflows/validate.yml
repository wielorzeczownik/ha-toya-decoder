name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=npm depName=prettier
  PRETTIER_VERSION: 3.9.10
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python: &python
              - '.github/workflows/validate.yml'
              - 'custom_components/**'
              - 'tests/**'
              - 'scripts/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
            integration:
              - *python
              - 'hacs.json'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'

      - name: Run hassfest
        if: ${{ !cancelled() && steps.filter.outputs.integration == 'true' }}
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

      - name: Run HACS validation
        if: ${{ !cancelled() && steps.filter.outputs.integration == 'true' }}
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

      - name: Lint
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: check

      - name: Format check Python
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: format --check

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: ${{ env.ACTIONLINT_VERSION }}
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  tests:
    name: Tests
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run --locked mypy custom_components/toya_decoder

      - name: Run tests
        run: uv run --locked pytest --cov=custom_components/toya_decoder --cov-report=term-missing
