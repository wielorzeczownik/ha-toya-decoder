name: Home Assistant Release

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/toya_decoder/**'
      - 'hacs.json'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  prepare-release:
    name: Prepare release
    needs:
      - hassfest
      - hacs
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.kind.outputs.kind == 'rc' }}
      commit_changes: ${{ steps.bump.outputs.commit_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide release kind
        id: kind
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT" == push && "$MESSAGE" != *"[security]"* ]]; then
            echo "kind=rc" >>"$GITHUB_OUTPUT"
          else
            echo "kind=stable" >>"$GITHUB_OUTPUT"
          fi

      - name: Determine next version (git-cliff)
        id: cliff_bumped
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: bumped-version.txt
          GITHUB_REPO: ${{ github.repository }}

      - name: Detect user-facing changes (git-cliff)
        id: cliff_userfacing
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff-release.toml
          args: ${{ steps.kind.outputs.kind == 'rc' && format('{0}..{1}', github.event.before, github.sha) || '--unreleased' }} --context
        env:
          OUTPUT: user-facing.json
          GITHUB_REPO: ${{ github.repository }}

      - name: Count user-facing commits
        id: userfacing
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq '[.[].commits[]] | length' user-facing.json)
          echo "User-facing commits since the last tag: $count"
          echo "count=$count" >>"$GITHUB_OUTPUT"

      - name: Bump manifest version
        id: bump
        if: ${{ steps.userfacing.outputs.count != '0' }}
        shell: bash
        env:
          RELEASE_KIND: ${{ steps.kind.outputs.kind }}
          CLIFF_BUMPED_VERSION: ${{ steps.cliff_bumped.outputs.content }}
        run: bash scripts/bump-version.sh

      - name: Generate release notes (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff-release.toml
          args: --unreleased --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate CHANGELOG.md (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Stage release files
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'true' }}
        run: git add custom_components/toya_decoder/manifest.json CHANGELOG.md

      - name: Stage changelog
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'false' && steps.kind.outputs.kind == 'stable' }}
        run: git add CHANGELOG.md

      - name: Commit release (verified)
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'chore(release): ${{ steps.bump.outputs.tag }} [skip ci]'
          skip-empty: true

      - name: Push commit
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        run: git push

      - name: Create tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: qoomon/actions--create-tag@bc18da911783e8dd24a7ae3ec1a95af941d29f60 # v1.0.0
        with:
          name: '${{ steps.bump.outputs.tag }}'
          message: '${{ steps.bump.outputs.tag }}'

      - name: Push tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        run: git push origin 'refs/tags/${{ steps.bump.outputs.tag }}'

      - name: Upload release notes
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build-artifact:
    name: Integration
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Build release zip
        run: |
          mkdir -p dist
          (cd custom_components/toya_decoder && zip -r ../../dist/toya_decoder.zip .)

      - name: Upload zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*

  publish-release:
    name: Release
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.tag }}
    needs:
      - prepare-release
      - build-artifact
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
          path: source

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: source
          format: spdx-json
          output-file: dist/ha-toya-decoder.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          draft: true
          files: dist/*

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          LATEST: ${{ needs.prepare-release.outputs.prerelease != 'true' }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"
